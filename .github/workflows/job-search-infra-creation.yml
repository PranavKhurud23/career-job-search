name: "Terraform Infrastructure CI/CD"

on:
  push:
    branches:
      - feature/test
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

jobs:
    terraform-deploy:
      name: "Terraform Apply"
      runs-on: ubuntu-latest
      
      # Required permissions for OIDC Workload Identity Federation
      permissions:
        contents: read
        id-token: write

      steps:
        # 1. Checkout repository code
        - name: Checkout Code
          uses: actions/checkout@v4

        # 2. Authenticate to Google Cloud using Workload Identity Federation (Keyless)
        - name: Authenticate to Google Cloud
          uses: google-github-actions/auth@v2
          with:
            workload_identity_provider: 'projects/1768256233/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
            service_account: 'terraform-deployer@project-3abb875e-b867-4aaf-843.iam.gserviceaccount.com'

        # 3. Set up Terraform CLI
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.6.0

        # 4. Initialize Terraform
        - name: Terraform Init
          run: terraform init
          working-directory: ./terraform

        # 5. Validate Terraform configuration
        - name: Terraform Validate
          run: terraform validate
          working-directory: ./terraform

        # 6. Apply Terraform Infrastructure
        - name: Terraform Apply
          run: terraform apply -auto-approve
          working-directory: ./terraform